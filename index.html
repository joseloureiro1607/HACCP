<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4a3d">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="HACCP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>JL Alimentar — HACCP</title>
<style>
:root{
  --bg:#f4f6f5;--card:#fff;--ink:#16211e;--mut:#5d6b67;--line:#dde3e1;
  --pri:#0f5c4d;--pri2:#e3f0ec;--ok:#1d7a46;--okb:#e2f4e9;--bad:#b42318;--badb:#fde8e6;
  --warn:#9a6700;--warnb:#fff4d6;--info:#1f5fa8;--infob:#e6effa;--r:10px;
  --sh:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1513;--card:#17201d;--ink:#e6eeeb;--mut:#9aaaa5;--line:#2a3633;
  --pri:#4fc3a1;--pri2:#16312a;--ok:#5fd28f;--okb:#15301f;--bad:#ff8a80;--badb:#3a1a18;
  --warn:#f0c04a;--warnb:#33290f;--info:#7fb2f0;--infob:#162538;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--pri)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.top{background:#123f36}}
.top b{font-size:16px}.top small{opacity:.8;display:block;font-size:12px}
.burger{display:none;background:none;border:0;color:#fff;font-size:22px;padding:4px 8px;cursor:pointer}
.wrap{display:flex;min-height:calc(100vh - 52px)}
nav{width:250px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:10px 0 40px;overflow-y:auto;position:sticky;top:52px;height:calc(100vh - 52px)}
nav h6{margin:14px 18px 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 18px;color:var(--ink);text-decoration:none;font-size:14px;border-left:3px solid transparent}
nav a:hover{background:var(--pri2)}
nav a.on{background:var(--pri2);border-left-color:var(--pri);font-weight:600}
nav{padding-top:0}
nav .grp{padding:2px 0 8px;border-bottom:1px solid #cfd5d8}
nav .grp:nth-of-type(odd){background:#e3e7ea}
nav .grp:nth-of-type(even){background:#f7f8f9}
nav .grp h6{color:#36423f;font-weight:700;margin-top:10px}
nav .grp a:hover{background:rgba(31,74,61,.10)}
@media (prefers-color-scheme:dark){nav .grp{border-bottom-color:#2a3633}nav .grp:nth-of-type(odd){background:#1f2a27}nav .grp:nth-of-type(even){background:#151d1a}nav .grp h6{color:#b9c7c2}}
.tnav{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:18px;line-height:1;padding:6px 10px;border-radius:8px;cursor:pointer}
.tnav:disabled{opacity:.35;cursor:default}
body.locked .tnav{display:none!important}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;font-size:13px;color:var(--mut)}
.crumb .btn{padding:5px 10px;font-size:13px}
.ogtree{overflow-x:auto}.ogtree ul{list-style:none;margin:0;padding-left:22px;border-left:2px solid var(--line)}.ogtree>ul{border-left:0;padding-left:0}.ogtree li{margin:8px 0;position:relative}.ogtree ul ul li:before{content:'';position:absolute;left:-22px;top:18px;width:18px;border-top:2px solid var(--line)}
.og{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-size:14px}.og:hover{border-color:var(--pri)}
table.trend td,table.trend th{text-align:center;padding:6px 5px}table.trend td:first-child{text-align:left}
details.help{background:var(--infob);border-color:transparent}details.help summary{cursor:pointer;list-style:none}details.help summary::-webkit-details-marker{display:none}details.help:not([open]){padding:8px 14px}
.tsync{font-size:12px;background:rgba(255,255,255,.16);border-radius:99px;padding:3px 9px;white-space:nowrap;cursor:pointer}
.tsync.err{background:#b91c1c}
pre.sql{white-space:pre-wrap;font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:320px;overflow:auto}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:640px){.mgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}}
@media (min-width:1000px){.mgrid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.mtile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;padding:12px 6px;border-radius:16px;color:#fff;text-decoration:none;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15);-webkit-tap-highlight-color:transparent;transition:transform .08s}
.mtile:active{transform:scale(.96)}
.mtile .mic{font-size:30px;line-height:1}.mtile .ml{font-weight:700;font-size:13px;line-height:1.15;letter-spacing:.01em}.mtile .msub{font-size:11px;opacity:.85}
.sem{position:absolute;top:8px;left:8px;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.sem.s-ok{background:#22c55e}.sem.s-warn{background:#facc15}.sem.s-bad{background:#ef4444}
nav a.st-ok{border-left:5px solid #22c55e}nav a.st-warn{border-left:5px solid #eab308}nav a.st-bad{border-left:5px solid #dc2626}
nav a.on.st-ok,nav a.on.st-warn,nav a.on.st-bad{font-weight:700}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.qgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.qgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ngrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:640px){.ngrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1000px){.ngrid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.ntile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;padding:12px 8px;border-radius:14px;background:#f1f4f3;border:1px solid var(--line);color:var(--ink);text-decoration:none;text-align:center;font:inherit;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);-webkit-tap-highlight-color:transparent;transition:transform .08s,background .15s}
.ntile:hover{background:var(--pri2)}.ntile:active{transform:scale(.97)}
.ntile.big{min-height:104px;flex-direction:row;justify-content:flex-start;gap:12px;padding:14px 16px;text-align:left}
.ntile .nic{font-size:28px;line-height:1}.ntile.big .nic{font-size:26px;flex:none}
.ntile .nl{font-weight:600;font-size:14px;line-height:1.2;min-width:0;overflow-wrap:anywhere}.ntile.big .nl{font-size:15px;padding-right:12px}
.ntile .nsub{font-size:11px;color:var(--mut)}
.ntile .sem{left:auto;right:8px}
.sem.sdot{position:static;display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-left:6px}
@media (prefers-color-scheme:dark){.ntile{background:#1c2724}}
.ngrid.q3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:640px){.ngrid.q3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mrow{display:flex;gap:10px;align-items:stretch;border:1px solid;border-radius:14px;padding:8px;margin:0 0 8px}
.mgrp{position:relative;flex:none;width:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.65);border-radius:10px;padding:8px 6px}
.mgrp .nic{font-size:26px}.mgrp .nl{font-weight:700;font-size:13px;line-height:1.15}.mgrp .sem{left:auto;right:6px;top:6px}
.msubs{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.msub{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.06);border-radius:99px;font-size:13px;color:var(--ink);text-decoration:none;line-height:1.2}
.msub:active{transform:scale(.97)}
@media (prefers-color-scheme:dark){.mrow{filter:brightness(.35) saturate(1.4)}.mgrp,.msub{color:#111}}
.mtile .mbadge{position:absolute;top:6px;right:8px;background:#fff;color:#b91c1c;font-style:normal;font-weight:800;font-size:12px;border-radius:99px;padding:1px 7px}
@media (min-width:640px){.mtile{min-height:120px}.mtile .mic{font-size:38px}.mtile .ml{font-size:15px}}
nav .grp h6{cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding-right:14px;user-select:none}
nav .grp h6::after{content:'▸';font-size:12px}
nav .grp.open h6::after{content:'▾'}
nav .grp:not(.open) a{display:none}
.todo{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card)}
.todo .ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.todo.done{opacity:.6}.todo.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}.todo.done .tt{text-decoration:line-through}
.todo.late .ck{border-color:var(--bad)}
.todo .tt{flex:1;min-width:0;font-size:14px}.todo .tt small{display:block;color:var(--mut);font-size:12px}
.todo .btn{padding:6px 12px;font-size:13px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}.prog>i{display:block;height:100%;background:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile:nth-child(odd){background:#eef1f3}@media (prefers-color-scheme:dark){.tile:nth-child(odd){background:#1f2a27}}
.tile h4{margin:0 0 6px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.tile a{display:block;padding:5px 0;color:var(--ink);text-decoration:none;font-size:14px;border-top:1px solid var(--line)}.tile a:first-of-type{border-top:0}
.top>div:not(#tUser){min-width:0;flex:1 1 auto;overflow:hidden}
.top>div:not(#tUser) b,.top>div:not(#tUser) small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:600px){.top{gap:6px;padding:8px 10px}.tnav{padding:6px 8px;font-size:16px}#tUser span{display:none}.top .sp{display:none}}
nav a .cnt{font-size:11px;color:var(--mut)}
main{flex:1;min-width:0;padding:20px 24px 80px;max-width:1300px}
@media (max-width:860px){
  .burger{display:block}
  nav{position:fixed;left:0;top:52px;z-index:30;transform:translateX(-100%);transition:transform .2s}
  nav.open{transform:none;box-shadow:4px 0 20px rgba(0,0,0,.2)}
  main{padding:16px 16px 80px}
}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:22px 0 10px}
h3{font-size:15px;margin:16px 0 8px}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.btn.p{color:#08201a}}
.btn.d{color:var(--bad);border-color:var(--bad)}
.btn.s{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
label.f{display:block;margin-bottom:12px}
label.f>span,.fl{display:block;font-size:13px;color:var(--mut);margin-bottom:4px;font-weight:500}
.req{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 14px}
.grid .wide{grid-column:1/-1}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:13px;cursor:pointer}
.chk input{width:auto;margin:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--bg);font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);white-space:nowrap}
tbody tr[data-id],tbody tr[data-k],tbody tr[data-p],tbody tr[data-go],tbody tr[data-m]{cursor:pointer}
tbody tr:hover{background:var(--pri2)}
tr.na td{opacity:.45}
td.del{width:36px;text-align:center}
.xs{background:none;border:0;color:var(--mut);font-size:18px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:6px}
.xs:hover{color:var(--bad);background:var(--badb)}
.bd{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--bg);color:var(--mut)}
.bd.ok{background:var(--okb);color:var(--ok)}.bd.bad{background:var(--badb);color:var(--bad)}
.bd.warn{background:var(--warnb);color:var(--warn)}.bd.info{background:var(--infob);color:var(--info)}
.bd.pcc{background:var(--bad);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh);cursor:pointer}
.kpi b{display:block;font-size:26px;line-height:1.1}
.kpi span{font-size:13px;color:var(--mut)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:8px;margin-bottom:6px;font-size:14px;cursor:pointer}
.alert.danger{background:var(--badb);color:var(--bad)}.alert.warn{background:var(--warnb);color:var(--warn)}.alert.info{background:var(--infob);color:var(--info)}
.alert i{font-style:normal;font-weight:700}
.empty{padding:30px;text-align:center;color:var(--mut)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto}
#modalHost2 .modal-bg{z-index:60}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:820px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:17px;flex:1}
.modal .body{padding:18px}
.modal footer{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);justify-content:flex-end;position:sticky;bottom:0;background:var(--card);border-radius:0 0 14px 14px}
@media (max-width:600px){.modal-bg{padding:0}.modal{border-radius:0;min-height:100vh}}
.x{background:none;border:0;font-size:22px;color:var(--mut);cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16211e;color:#fff;padding:10px 18px;border-radius:8px;z-index:99;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:90vw}
.flow{display:flex;flex-direction:column;align-items:center}
.flow .st{border:2px solid var(--pri);border-radius:8px;padding:8px 14px;min-width:240px;max-width:420px;text-align:center;background:var(--card)}
.flow .st.pcc{border-color:var(--bad)}
.flow .ar{height:22px;width:2px;background:var(--mut);position:relative}
.flow .ar:after{content:"";position:absolute;bottom:-1px;left:-5px;border:6px solid transparent;border-top-color:var(--mut)}
.flows{display:flex;flex-wrap:wrap;gap:24px;justify-content:center}
.mut{color:var(--mut)}.sm{font-size:13px}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;align-items:center}
.lines{margin-bottom:8px}
.lrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px 8px;border:1px solid var(--line);border-radius:8px;padding:8px 36px 8px 8px;margin-bottom:8px;position:relative;background:var(--bg)}
.lrow label{display:block;min-width:0}
.lrow label>span{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
.lrow label.big{grid-column:span 2}
.lrow input,.lrow select{padding:6px 8px;font-size:14px}
.lrow .xs{position:absolute;top:6px;right:4px}
.lrow .hint{grid-column:1/-1;font-size:12px;color:var(--mut)}
.files{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.file{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.file a{flex:1;cursor:pointer;word-break:break-all}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:10px;border:1px dashed var(--pri);border-radius:10px;margin-bottom:14px;background:var(--pri2)}
details.stk{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:8px}
details.stk summary{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;cursor:pointer;list-style:none}
details.stk summary::-webkit-details-marker{display:none}
details.stk[open] summary{border-bottom:1px solid var(--line)}
.prog{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri)}
.sug label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.sug label input{width:auto;margin-top:3px}
.sug label.done{opacity:.55}
.top .sp{flex:1}
@media (max-width:560px){#tUser span{display:none}}
.tinst{background:#f3efe4;color:#1f4a3d;border:0;border-radius:8px;padding:6px 12px;font:600 13px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
#tUser{display:flex;align-items:center;gap:8px;font-size:13px;text-align:right}
#tUser button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
body.locked nav,body.locked .burger{display:none!important}
body.locked main{max-width:560px;margin:0 auto}
.sigs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.sig{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 30px 6px 8px;background:var(--bg);position:relative;min-height:66px}
.sig img{height:54px;max-width:170px;background:#fff;border-radius:4px}
.sig .xs{position:absolute;top:2px;right:2px}
.perm{display:grid;grid-template-columns:1fr 150px;gap:6px 10px;align-items:center;font-size:14px;margin-bottom:6px}
.perm select{padding:5px 8px}
.docprev{line-height:1.55;overflow-x:auto}.docprev table{border-collapse:collapse}.docprev td,.docprev th{border:1px solid var(--line)}
.found{border-bottom:1px solid var(--line);padding:8px 0;cursor:pointer}.found:hover{background:var(--pri2)}
#printOne{display:none}
@media print{ body.print-one>*:not(#printOne){display:none!important} body.print-one #printOne{display:block} #printOne th{width:32%;text-align:left} #printOne .sig img{height:70px} }
pre.txt{white-space:pre-wrap;font-size:12px;max-height:220px;overflow:auto;background:var(--bg);padding:10px;border-radius:8px}
.pr-only{display:none}
@media print{
  .top,nav,.noprint,.btn,td.del,th.del{display:none!important}
  main{padding:0;max-width:none}
  body,html{background:#fff;color:#000;font-size:11px}
  .card,.tw{box-shadow:none;border-color:#bbb}
  th{background:#eee;color:#000}
  .pr-only{display:block}
  h2{page-break-after:avoid}
  .pb{page-break-before:always}
  tr{page-break-inside:avoid}
}
</style>

function stockLots(excludeProd){
  const lots=[];
  D('rececao').forEach(r=>(r.linhas||[]).forEach(l=>{ if(!l.materia) return;
    lots.push({id:l.id,materia:l.materia,preco:num(l.preco),lote:l.loteInt||l.lote||'(sem lote)',loteForn:l.loteInt?l.lote||'':'',validade:l.validade||'',data:r.data,fornecedor:r.fornecedor,recId:r.id,rec:num(l.qtd)||0,used:0,rejeitado:r.decisao==='Rejeitado'||l.estado==='Rejeitado'}); }));
  const by=Object.fromEntries(lots.map(l=>[l.id,l]));

  D('lotes').forEach(p=>{ if(p.id===excludeProd) return; (p.consumos||[]).forEach(c=>{ if(by[c.linha]) by[c.linha].used+=+c.qtd||0; }); });
  D('ajustes').forEach(a=>{ if(by[a.linha]) by[a.linha].used+=+a.qtd||0; });

}

/* Calcula as quantidades de uma receita.
   modo 'qtd'  → valor = quantidade final a produzir (na unidade do rendimento)

function recipeCalc(rc,modo,valor){
  if(!rc) return {erro:'Escolha a receita.'};
  if(num(valor)==null||+valor<=0) return {erro:modo==='base'?'Indique a quantidade do ingrediente base.':'Indique a quantidade a produzir.'};
  const ing=(rc.ingredientes||[]).filter(i=>i.materia&&num(i.qtd)!=null);
  const baseL=rc.base?ing.find(i=>i.materia===rc.base&&(i.modo||'Proporcional')==='Proporcional'):null;
  let fac;
  if(modo==='base'){ if(!baseL||!(+baseL.qtd)) return {erro:'Esta receita não tem ingrediente base definido.'}; fac=+valor/+baseL.qtd; }
  else if(modo==='vezes') fac=+valor;
  else { if(!num(rc.rendimento)) return {erro:'A receita não tem rendimento definido.'}; fac=+valor/+rc.rendimento; }
  const baseQ=baseL?+baseL.qtd*fac:null; const avisos=[];
  const lines=ing.map(i=>{ const md=i.modo||'Proporcional'; let liq;
    if(md==='Fixa') liq=modo==='vezes'?+i.qtd*fac:+i.qtd; else if(md==='% do ingrediente base'){ if(baseQ==null){ avisos.push(lbl('materias',i.materia)+': falta o ingrediente base'); return null; } liq=baseQ*+i.qtd/100; } else liq=+i.qtd*fac;
    const ap=num(i.aprov)!=null&&+i.aprov>0&&+i.aprov<=100?+i.aprov:100;
    return {materia:i.materia,liq:rnd(liq),bruto:rnd(liq*100/ap),aprov:ap}; }).filter(Boolean);
  const prev=num(rc.rendimento)!=null?rnd(+rc.rendimento*fac):null; const totIng=lines.reduce((t,l)=>t+l.liq,0);

    if(md==='% de um ingrediente'){ const l=lines.find(y=>y.materia===x.ref); q=l?l.liq*+x.qtd/100:null; } else if(md==='% do total de ingredientes'||md==='% da receita (total de ingredientes)') q=totIng*+x.qtd/100; else if(md==='% do produto obtido') q=prev!=null?prev*+x.qtd/100:null; else q=+x.qtd*fac;

function interpLote(pat){ pat=String(pat||''); if(/\{[A-Za-z0-9]+\}/.test(pat)) return pat.replace(/\{([A-Za-z0-9]+)\}/g,(m,t)=>'{'+t.toUpperCase()+'}');

/* Estado de uma tarefa periódica: dates = datas/horas dos registos; horas = 'HH:MM; HH:MM' opcionais */
function freqStatus(freq,dates,horas){ const hoje=today(); freq=freq||'Diária';
  const m=/^(\d)x por dia$/.exec(freq); const perDay=m?+m[1]:(freq==='Diária'||freq==='Dias úteis')?1:0;
  if(perDay){ const wd=new Date().getDay(); if(freq==='Dias úteis'&&(wd===0||wd===6)) return null;
    const n=dates.filter(d=>String(d||'').startsWith(hoje)).length; const hs=String(horas||'').split(/[;,\s]+/).map(x=>x.trim()).filter(x=>/^\d{1,2}[:h]\d{2}$/.test(x)).map(x=>x.replace('h',':').padStart(5,'0')).sort();
    const now=new Date().toTimeString().slice(0,5); const devidos=hs.length?hs.filter(h=>h<=now).length:0;
    return {need:perDay,n,done:n>=perDay,late:hs.length?n<devidos:(perDay===1?new Date().getHours()>=12:false),sub:(perDay>1?n+' de '+perDay+' hoje':freq)+(hs.length?' · às '+hs.join(', '):'')}; }
  const dd=FREQ_DAYS[freq]; if(!dd) return null;
  const last=dates.map(d=>String(d||'').slice(0,10)).filter(Boolean).sort().pop(); const age=last?-daysTo(last):null;
  return {need:1,n:age!=null&&age<dd?1:0,done:age!=null&&age<dd,late:age==null||age>=dd,sub:freq+(last?' · último '+fDate(last):' · nunca registado')}; }

async function deleteRecord(key,id){
  const r=D(key).find(x=>x.id===id); if(!r) return;
  if(!confirm('Eliminar «'+(M[key].label(r)||'registo')+'»?'+(key==='equipamentos'?'\n\nDica: para manter o histórico pode antes marcar o equipamento como «Em uso: Não».':''))) return;
  if(lvl(key)<3){ toast('Sem permissão para eliminar'); return; }
  for(const f of M[key].f.filter(f=>f.t==='files')) for(const a of (r[f.k]||[])) await FDB.del(a.id).catch(()=>{});
  for(const f of M[key].f.filter(f=>f.t==='sig')) if(r[f.k]) await FDB.del(r[f.k].fid).catch(()=>{});
  for(const sg of (r.assinaturas||[])) await FDB.del(sg.fid).catch(()=>{});
  await FDB.del('t:'+id).catch(()=>{});
  S.data[key]=D(key).filter(x=>x.id!==id); save(); closeModal(1); render(); toast('Registo eliminado');
}

/* ---------- Controlos de formulário ---------- */
function optsFor(f){ if(f.t==='ref') return optsRef(f.ref,f.filter)(); const o=typeof f.o==='function'?f.o():f.o; return o.map(x=>typeof x==='object'?x:{v:x,l:x}); }
function ctrl(f,val,attr){
  const t=f.t||'text';
  if(t==='textarea') return '<textarea '+attr+'>'+esc(val)+'</textarea>';
  if(t==='sel'||t==='ref'){ const o=optsFor(f); let h='<select '+attr+(t==='ref'?' data-ref="'+f.ref+'"':'')+'><option value="">—</option>'+o.map(x=>'<option value="'+esc(x.v)+'"'+(String(x.v)===String(val)?' selected':'')+'>'+esc(x.l)+'</option>').join('')+(t==='ref'&&QUICK[f.ref]&&lvl(f.ref)>=2?'<option value="__new">+ Adicionar novo…</option>':'');
    if(val&&!o.some(x=>String(x.v)===String(val))) h+='<option value="'+esc(val)+'" selected>'+esc(val)+'</option>';
    return h+'</select>'; }
  const ty=t==='dt'?'datetime-local':t; return '<input type="'+ty+'" '+attr+' value="'+esc(val)+'"'+(t==='number'?' step="any" inputmode="decimal"':'')+'>';
}
function lineRow(f,r){ r=r||{}; const id=r.id||uid();
  return '<div class="lrow" data-lid="'+esc(id)+'">'+f.cols.map(c=>{ let v=r[c.k]; if((v==null||v==='')&&c.def&&!r.id) v=c.def; return '<label'+(c.big?' class="big"':'')+'><span>'+esc(c.l)+'</span>'+ctrl(c,v??'','data-c="'+c.k+'"')+'</label>'; }).join('')+
    '<div class="hint">'+(f.hint?esc(f.hint(r)):'')+'</div><button type="button" class="xs" data-delline title="Remover linha">&times;</button></div>'; }
function fieldHTML(f,val){
  const t=f.t||'text', req=f.req?' <span class="req">*</span>':'';
  let inp;
  if(t==='multi'||t==='refm'){ const o=t==='refm'?optsRef(f.ref)():f.o.map(x=>typeof x==='object'?x:{v:x,l:x}); const arr=Array.isArray(val)?val:[];
    inp='<div class="chk">'+o.map(x=>'<label><input type="checkbox" name="'+f.k+'" value="'+esc(x.v)+'"'+(arr.includes(x.v)?' checked':'')+'>'+esc(x.l)+'</label>').join('')+(o.length?'':'<small class="mut">Sem opções disponíveis.</small>')+'</div>'; }
  else if(t==='lines'){ const arr=Array.isArray(val)?val:[]; inp='<div class="lines" data-lines="'+f.k+'">'+arr.map(r=>lineRow(f,r)).join('')+'</div><button type="button" class="btn s" data-addline="'+f.k+'">+ Adicionar linha</button>'; }
  else if(t==='sig'){ inp='<div class="sigs" data-sig="'+f.k+'"></div><button type="button" class="btn s" data-signf="'+f.k+'">Assinar</button>'; }
  else if(t==='dyn'){ inp='<div data-dyn="'+f.k+'"></div>'; }
  else if(t==='files'){ inp='<div class="files" data-files="'+f.k+'"></div><input type="file" multiple data-fin="'+f.k+'" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.csv,.txt">'; }
  else { inp=ctrl(f,val,'name="'+f.k+'"'); if(t==='ref'&&!optsFor(f).length) inp+='<small class="mut">Sem registos em «'+esc(M[f.ref].t)+'». <a href="#/'+f.ref+'" data-close>Adicionar</a></small>'; }
  const wide=f.w||['textarea','multi','refm','lines','files','sig','dyn'].includes(t);
  return '<label class="f'+(wide?' wide':'')+'"><span>'+esc(f.l)+req+'</span>'+inp+'</label>';
}
function readForm(root,fields){
  const o={};
  fields.forEach(f=>{
    if(f.t==='multi'||f.t==='refm') o[f.k]=[...root.querySelectorAll('[name="'+f.k+'"]:checked')].map(x=>x.value);
    else if(f.t==='lines') o[f.k]=[...root.querySelectorAll('[data-lines="'+f.k+'"] .lrow')].map(row=>{ const x={id:row.dataset.lid}; f.cols.forEach(c=>{ const el=row.querySelector('[data-c="'+c.k+'"]'); x[c.k]=el?el.value.trim():''; }); return x; })
      .filter(x=>f.cols.some(c=>!c.def&&x[c.k]));
    else if(f.t==='files') o[f.k]=root._files&&root._files[f.k]?root._files[f.k].keep:[];
    else if(f.t==='sig') o[f.k]=root._sig&&root._sig[f.k]||null;
    else if(f.t==='dyn') o[f.k]=f.read(root);
    else { const el=root.querySelector('[name="'+f.k+'"]'); if(el) o[f.k]=el.value.trim(); }
  });
  return o;
}
function renderFiles(root,k){
  const st=root._files[k]; const box=root.querySelector('[data-files="'+k+'"]'); if(!box) return;
  const items=[...st.keep.map(a=>({a,src:'k'})),...st.add.map(a=>({a,src:'n'}))];
  box.innerHTML=items.map((x,i)=>'<div class="file"><a data-open="'+i+'">'+esc(x.a.name)+'</a><span class="mut">'+(x.a.size?Math.round(x.a.size/1024)+' KB':'')+(x.src==='n'?' · por guardar':'')+'</span><button type="button" class="xs" data-rmf="'+i+'">&times;</button></div>').join('');
  box.querySelectorAll('[data-open]').forEach(a=>a.onclick=async()=>{ const x=items[+a.dataset.open]; if(x.src==='n') openBlob(x.a,x.a.name); else openBlob(await FDB.get(x.a.id).catch(()=>null),x.a.name); });
  box.querySelectorAll('[data-rmf]').forEach(b=>b.onclick=()=>{ const x=items[+b.dataset.rmf]; if(x.src==='k'){ st.keep=st.keep.filter(a=>a!==x.a); st.del.push(x.a.id); } else st.add=st.add.filter(a=>a!==x.a); renderFiles(root,k); });
}

function auditTxt(r){ const a=[]; if(r._c) a.push('Criado'+(r._u?' por '+userName(r._u):'')+' em '+fDate(r._c)); if(r._m) a.push('alterado'+(r._e?' por '+userName(r._e):'')+' em '+fDate(r._m)); if(r._imp) a.push('importado'); return a.join(' · '); }

function guessCampo(h){ const t=String(h).replace(/\s+/g,' ').trim(); const n=norm(t)+' '+t.toLowerCase(); const c={nome:t,tipo:'Número',unidade:'',min:'',max:'',opcoes:''};
  const u=t.match(/\(([^)]*)\)/); const inner=u?u[1]:'';
  const nums=(inner||t).replace(/,/g,'.').match(/-?\d+(?:\.\d+)?/g)||[];
  if(/[°º]\s*c|temp/.test(n)||/°|º/.test(t)) c.unidade='°C';
  else if(/\bph\b/.test(n)) c.unidade='';
  else if(/%|percent|humidade|compostos polares/.test(n)) c.unidade='%';
  else if(/\bkg\b/.test(n)) c.unidade='kg'; else if(/\bppm\b/.test(n)) c.unidade='ppm'; else if(/\bmin\b|minutos/.test(n)) c.unidade='min'; else if(/\blitros?\b|\(l\)/.test(n)) c.unidade='L';
  if(/c\s*\/\s*nc|conforme|\bok\b|estado|verifica|avalia|aspeto|limpeza|controlo visual/.test(n)&&!c.unidade){ c.tipo='Conforme / Não conforme'; }
  else if(/\bs\s*\/\s*n\b|sim\s*\/\s*n|\(s\/n\)/.test(n)){ c.tipo='Sim / Não'; }
  else if(/^hora|\bhora\b/.test(n)&&!c.unidade){ c.tipo='Hora'; }
  else if(/validade|^data\b/.test(n)&&!c.unidade){ c.tipo='Data'; }
  else if(!c.unidade&&!/\bph\b|quant|peso|tempo|n\.?º|numero|valor|leitura|concentra|densidade|volume|acidez/.test(n)){ c.tipo='Texto'; }
  if(c.tipo==='Número'){ if(/[≤<]|max|ate|até/.test(n)&&nums.length) c.max=nums[nums.length-1]; else if(/[≥>]|min/.test(n)&&nums.length) c.min=nums[0]; else if(nums.length>=2&&/\d\s*(a|-|–|\/)\s*-?\d/.test(inner||t)){ c.min=nums[0]; c.max=nums[1]; } }
  c.nome=t.replace(/\s*\([^)]*\)\s*/g,' ').replace(/\s*[≤≥<>]=?\s*-?\d+[.,]?\d*\s*(°c|ºc|%)?/gi,'').trim()||t;
  return c; }
const SKIP_COL=/^(data|dia|data\s*\/\s*hora|n\.?º|nº|#)$|respons|rubrica|assinatura|visto|operador|funcionario|executado por|verificado por|observa|a[cç][aã]o corretiva|medida corretiva/;
const ITEM_COL=/^(equipamento|área|area|local|produto|item|ponto|zona|câmara|camara|dispositivo|isco|fritadeira|veículo|veiculo|tarefa|requisito|descri)/i;
function modeloFromTable(rows,titulo){ rows=rows.map(r=>r.map(c=>String(c||'').replace(/\s+/g,' ').trim()));
  const hi=headerRow(rows); const head=rows[hi]||[]; const before=rows.slice(0,hi).map(r=>r.filter(Boolean).join(' ')).filter(Boolean);
  const nome=before.find(x=>x.length>4&&x.length<90&&!/empresa|morada|nif|página|pagina/i.test(x))||titulo;
  const body=rows.slice(hi+1).filter(r=>r.some(Boolean));
  let itemCol=-1; if(head[0]&&ITEM_COL.test(head[0])) itemCol=0;
  else { const col0=body.map(r=>r[0]).filter(Boolean); if(col0.length>=2&&col0.every(v=>!/^\d+([.,/-]\d+)*$/.test(v)&&isNaN(Date.parse(v)))&&new Set(col0).size===col0.length&&body.slice(0,col0.length).every(r=>r.slice(1).every(c=>!c))) itemCol=0; }
  const itens=itemCol>=0?[...new Set(body.map(r=>r[itemCol]).filter(Boolean))].slice(0,40):[];
  const campos=head.map((h,i)=>({h,i})).filter(x=>x.h&&x.i!==itemCol&&!SKIP_COL.test(norm(x.h))).map(x=>guessCampo(x.h));
  return {nome,itens:itens.join('\n'),campos}; }
function modeloFromLines(lines,titulo){ const L=lines.map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x&&x.length<140);
  const nome=L.find(x=>x.length>4&&x.length<90&&!/empresa|morada|nif|página|pagina|^\d+$/i.test(x))||titulo;
  const itens=L.filter(x=>x!==nome&&!/^(data|hora|respons|rubrica|assinatura|observa|visto|página|pagina)/i.test(x)&&!/^[\d\s.,:/-]+$/.test(x)&&x.replace(/[^A-Za-zÀ-ú]/g,'').length>=4).slice(0,40);
  return {nome,itens:itens.join('\n'),campos:[{nome:'Avaliação',tipo:'Conforme / Não conforme'},{nome:'Observação',tipo:'Texto'}]}; }
async function importModelo(file){
  const n=file.name.toLowerCase(); const titulo=file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
  const st=modal('A ler o impresso','<p id="imSt" class="sm">A abrir '+esc(file.name)+'…</p>',[{l:'Cancelar',fn:()=>closeModal(2)}],2);
  const prog=t=>{ const el=st.querySelector('#imSt'); if(el) el.textContent=t; };
  let mod=null;
  try{
    if(/\.(xlsx|xls|ods|csv)$/.test(n)){ const sh=await readSheets(file); const best=Object.values(sh).sort((a,b)=>b.length-a.length)[0]||[]; mod=modeloFromTable(best,titulo); }
    else if(n.endsWith('.docx')){ await loadScript(LIB.docx); const r=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()}); const doc=new DOMParser().parseFromString(r.value,'text/html');
      const tb=[...doc.querySelectorAll('table')].map(t=>[...t.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>td.textContent))).sort((a,b)=>b.length*(b[0]||[]).length-a.length*(a[0]||[]).length)[0];
      const pre=[...doc.body.children].filter(e=>e.tagName!=='TABLE').map(e=>e.textContent.trim()).filter(Boolean);
      if(tb&&tb.length&&Math.max(...tb.map(r=>r.length))>=2){ mod=modeloFromTable(tb,pre.find(x=>x.length>4&&x.length<90)||titulo); if(pre.length&&mod.nome===titulo) mod.nome=pre[0].slice(0,90); }
      else mod=modeloFromLines(pre,titulo); }
    else if(n.endsWith('.pdf')){ const t=await pdfText(file,prog); mod=modeloFromLines(t.split('\n'),titulo); }
    else if(/^image\//.test(file.type)){ const t=await ocr(file,prog); mod=modeloFromLines(t.split('\n'),titulo); }
    else { closeModal(2); toast('Formato não suportado. Use Excel, Word (.docx), PDF ou foto.'); return; }
  }catch(e){ closeModal(2); toast('Não foi possível ler o ficheiro: '+(e.message||e),6000); return; }
  closeModal(2);
  if(!mod.campos.length) mod.campos=[{nome:'Avaliação',tipo:'Conforme / Não conforme'}];
  const fid=uid(); let docs=[]; try{ await FDB.put(fid,file); docs=[{id:fid,name:file.name,type:file.type,size:file.size}]; }catch(e){}
  openForm('modelos',null,{nome:mod.nome,sector:'Específico da empresa',itens:mod.itens,campos:mod.campos.map(c=>({id:uid(),nome:c.nome,tipo:c.tipo,unidade:c.unidade||'',min:c.min||'',max:c.max||'',opcoes:c.opcoes||''})),docs});
  toast('Impresso lido: '+mod.campos.length+' campo(s)'+(mod.itens?' e '+mod.itens.split('\n').length+' linha(s)':'')+'. Confirme, ajuste e guarde.',7000);
}

function gs1Date(d){ const y=2000+(+d.slice(0,2)), m=d.slice(2,4); let dd=d.slice(4,6); if(dd==='00') dd=pad(new Date(y,+m,0).getDate()); return y+'-'+m+'-'+dd; }
function parseCode(raw){
  let s=String(raw||'').trim(); const out={raw:s};

  if(/^\(\d{2,4}\)/.test(s)){ const re=/\((\d{2,4})\)([^(]*)/g; let m; while((m=re.exec(s))) res[m[1]]=m[2].trim(); }
  else if(/^\d{8}$|^\d{12,14}$/.test(s)){ out.gtin=s; return out; }
  else if(/^(01|02)\d{14}/.test(s)||s.includes(GS)){
    const FIX={'00':18,'01':14,'02':14,'11':6,'12':6,'13':6,'15':6,'16':6,'17':6,'20':2};
    let i=0,g=0;
    while(i<s.length&&g++<25){
      if(s[i]===GS){i++;continue;}
      const a2=s.substr(i,2), a4=s.substr(i,4);
      if(FIX[a2]){ res[a2]=s.substr(i+2,FIX[a2]); i+=2+FIX[a2]; continue; }
      if(/^3[1-6]\d\d$/.test(a4)){ res[a4]=s.substr(i+4,6); i+=10; continue; }
      const av=['240','241','400'].find(a=>s.startsWith(a,i))||(['10','21','22','30','37'].includes(a2)?a2:null);
      if(av){ const st=i+av.length; let e=s.indexOf(GS,st); if(e<0) e=s.length; res[av]=s.slice(st,e); i=e; continue; }
      break;
    }
  }
  if(!Object.keys(res).length){ out.texto=s; return out; }
  if(res['01']||res['02']) out.gtin=res['01']||res['02'];
  if(res['10']) out.lote=res['10'];
  const d=res['17']||res['15']||res['16']; if(d&&/^\d{6}$/.test(d)) out.validade=gs1Date(d);

async function pdfText(file,prog,noOcr){
  await loadScript(LIB.pdf); const pdfjs=window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc=LIB.pdfw;
  const doc=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise; let all=''; const canv=[];
  for(let p=1;p<=Math.min(doc.numPages,10);p++){
    prog('A ler a página '+p+' de '+doc.numPages+'…');
    const page=await doc.getPage(p); const tc=await page.getTextContent(); const rows={};
    tc.items.forEach(it=>{ if(!it.str.trim()) return; const y=Math.round(it.transform[5]/3)*3; (rows[y]=rows[y]||[]).push({x:it.transform[4],s:it.str}); });
    const txt=Object.keys(rows).map(Number).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim()).join('\n');
    if(txt.replace(/\s/g,'').length<40){ const vp=page.getViewport({scale:2}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise; canv.push(c); }

async function ocr(img,prog){

  return r.data.text||'';
}
function toISO(d){ const m=String(d).match(/(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})/); if(!m) return ''; let a=+m[1],b=+m[2],c=+m[3];
  if(m[1].length===4) return a+'-'+pad(b)+'-'+pad(c); if(c<100) c+=2000; if(b>12||a>31) return ''; return c+'-'+pad(b)+'-'+pad(a); }
const DATE_RE=/\b(\d{1,2}[\/\-.]\d{1,2}[\/\-.](?:\d{4}|\d{2})|\d{4}-\d{2}-\d{2})\b/;
function parseInvoice(text){
  const lines=text.split(/\n/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
  const out={items:[],fornecedor:'',documento:'',data:''};
  const own=String(S.empresa.nif||'').replace(/\D/g,'');
  const nifs=(text.match(/\b\d{9}\b/g)||[]).filter(n=>n!==own);
  let f=D('fornecedores').find(x=>x.nif&&nifs.includes(String(x.nif).replace(/\D/g,'')));
  if(!f){ const nt=norm(text); f=D('fornecedores').find(x=>x.nome&&norm(x.nome).length>3&&nt.includes(norm(x.nome))); }
  if(f) out.fornecedor=f.id;
  const dm=text.match(/(?:fatura|factura|guia|documento|ft|fr|gr|gt)[^\n]{0,4}?\s*(?:n\.?[ºo°]?\s*)?([A-Z]{1,4}[ \/-]?[A-Z0-9]{0,8}[\/ -]\d{1,8})/i); if(dm) out.documento=dm[1].trim();
  const dd=text.match(DATE_RE); if(dd) out.data=toISO(dd[1]);
  const mats=D('materias').map(m=>({m,toks:norm(m.nome).split(' ').filter(t=>t.length>=3),codes:[m.codigo,...String(m.ean||'').split(/[,;\s]+/)].filter(Boolean).map(String)}));
  const LOT=/(?:\b(?:lote|lot|lt)\b\.?\s*(?:n\.?\s*[º°o]\.?\s*)?[:#]?|\bL\s*[.:])\s*([A-Z0-9][A-Z0-9\-\/.]{1,18})/i;
  const VAL=/(?:val(?:idade)?|v\.|exp|dlc|ddm|consumir|best before|bb|cons\.)[^\d]{0,15}(\d{1,2}[\/\-.]\d{1,2}[\/\-.](?:\d{4}|\d{2})|\d{4}-\d{2}-\d{2})/i;
  const QTY=/(\d+(?:[.,]\d+)?)\s*(kg|kgs|g|lt|l|litros?|un|uni|unid|cx|ml)\b/i;
  let cur=null;
  lines.forEach(line=>{
    const nl=norm(line); let best=null,score=0;
    mats.forEach(o=>{ if(o.codes.some(c=>c.length>=4&&line.includes(c))){ best=o.m; score=99; return; }
      if(!o.toks.length) return; const hit=o.toks.filter(t=>nl.includes(t)).length/o.toks.length; if(hit>score&&hit>=0.6){ score=hit; best=o.m; } });
    const lot=(line.match(LOT)||[])[1]; let val=(line.match(VAL)||[])[1]; const qa=[...line.matchAll(new RegExp(QTY.source,'gi'))]; const q=qa.length?qa[qa.length-1]:null;
    if(!val&&lot){ const d2=line.replace(LOT,'').match(DATE_RE); if(d2) val=d2[1]; }
    const money=[...line.matchAll(/(\d{1,6}[.,]\d{2,4})(?!\s*(?:kg|g|l|lt|un|ml)\b)/gi)].map(m=>parseFloat(m[1].replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')));
    const preco=money.length>=2?money[money.length-2]:(money.length===1&&q?money[0]:'');
    if(best){ cur={texto:line,materia:best.id,lote:lot||'',validade:val?toISO(val):'',qtd:q?parseFloat(q[1].replace(',','.')):'',preco:preco||''}; out.items.push(cur); }
    else if(cur&&(lot||val)&&(!cur.lote||!cur.validade)){ if(lot&&!cur.lote) cur.lote=lot; if(val&&!cur.validade) cur.validade=toISO(val); cur.texto+=' | '+line; }
    else if(q&&/[a-zA-Z]{4,}/.test(line.replace(QTY,''))&&!/total|iva|subtotal|desconto|portes|incid/i.test(line)){ cur={texto:line,materia:'',lote:lot||'',validade:val?toISO(val):'',qtd:parseFloat(q[1].replace(',','.'))}; out.items.push(cur); }
    else cur=cur&&(lot||val)?cur:null;
  });
  return out;
}

/* ---------- Importar CSV genérico ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,''); const first=text.split(/\r?\n/)[0]; const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true; else if(c===sep){ row.push(cell); cell=''; } else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; } else cell+=c; }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
async function readWB(file,name){ await loadScript(LIB.xlsx); name=(name||file.name||'').toLowerCase();

function headerRow(rows){ let best=-1,bs=-1; const lim=Math.min(rows.length,25);
  for(let i=0;i<lim;i++){ const r=rows[i]||[]; const cells=r.map(c=>String(c??'').trim()).filter(Boolean); if(cells.length<2) continue;
    const txt=cells.filter(c=>!/^[-+]?\d+([.,]\d+)?$/.test(c)&&!/^\d{1,4}[\/.-]\d{1,2}[\/.-]\d{1,4}/.test(c)&&c.length<60).length;
    const next=rows.slice(i+1,i+4).filter(x=>x&&x.some(c=>String(c??'').trim())).length;
    const sc=txt*2+cells.length-(cells.length-txt)*3+(next?2:-5); if(sc>bs){ bs=sc; best=i; } }
  return best<0?0:best; }

  const isLab=c=>c&&c.length<=50&&!/^-?\d+([.,]\d+)?$/.test(c)&&!/^\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}$/.test(c);
  const put=(k,v)=>{ k=k.replace(/[:：]\s*$/,'').trim(); if(!k||k in kv) return; kv[k]=v; keys.push(k); pairs++; };
  for(const r of R){ const c=r.filter(Boolean); const n0=norm(c[0]);
    if(KV_TASK_RX.test(n0)&&c[0].length<70&&(c.length===1||!c[1])){ inT=true; th=null; continue; }
    if(inT){ if(!th&&c.length>1&&c.every(x=>x.length<40)&&c.some(x=>/tarefa|descri|opera|periodic|frequ|respons|o que/.test(norm(x)))){ th=c; continue; }
      if(c.length===2&&isLab(c[0])&&/:\s*$/.test(c[0])){ inT=false; put(c[0],c[1]); continue; }
      tasks.push(c.join(' — ').replace(/^[-•*·]\s*/,'')); continue; }
    if(c.length===1){ if(/:\s*\S/.test(c[0])&&c[0].indexOf(':')<45){ const i=c[0].indexOf(':'); put(c[0].slice(0,i),c[0].slice(i+1).trim()); } continue; }
    if(c.length%2===0&&c.length<=6&&c.filter((x,i)=>i%2===0).every(isLab)){ for(let i=0;i<c.length;i+=2) put(c[i],c[i+1]); continue; }
    if(isLab(c[0])&&c.length<=4){ put(c[0],c.slice(1).join(' ')); continue; } }
  if(pairs<3||pairs<R.length*0.3) return null; return {kv,keys,tasks}; }
const KV_NOME=/^(equipamento|designacao|nome|identificacao|descricao do equipamento|denominacao|maquina|camara)$/;
function kvMerge(T,fname){ const K=T.map(t=>({t,k:kvSheet(t.rows)})); const ks=K.filter(x=>x.k); if(!ks.length) return T;
  const nk=x=>new Set(x.k.keys.map(norm)); let use=ks;
  if(ks.length===1){ const hit=ks[0].k.keys.filter(k=>Object.values(SYN).some(a=>a.includes(norm(k)))).length; if(hit<3) return T; }
  else { const base=nk(ks[0]); use=ks.filter(x=>{ const s2=nk(x); const inter=[...s2].filter(z=>base.has(z)).length; return inter>=Math.min(3,Math.ceil(Math.min(base.size,s2.size)*0.5)); }); if(use.length<2) return T; }
  const keys=[]; use.forEach(x=>x.k.keys.forEach(k=>{ if(!keys.some(z=>norm(z)===norm(k))) keys.push(k); }));
  const hasNome=keys.some(k=>KV_NOME.test(norm(k))); const hasPer=keys.some(k=>/periodic|frequen/.test(norm(k)));
  const head=[hasNome?'Folha':'Nome',...keys,'Tarefas de manutenção',...(hasPer?[]:['Periodicidade'])];
  const W={diaria:1,semanal:7,quinzenal:14,mensal:30,bimestral:60,trimestral:91,semestral:182,anual:365};
  const rows=use.map(x=>{ const g=k=>{ const kk=Object.keys(x.k.kv).find(z=>norm(z)===norm(k)); return kk?x.k.kv[kk]:''; };
    let per=''; if(!hasPer){ const ds=x.k.tasks.map(t=>{ const n=norm(t); const w=Object.keys(W).find(w=>n.includes(w)); return w?W[w]:null; }).filter(Boolean); if(ds.length) per=Math.min(...ds); }
    return [x.t.name,...keys.map(g),x.k.tasks.join('\n'),...(hasPer?[]:[per])]; });
  const used=new Set(use.map(x=>x.t)); const out=T.filter(t=>!used.has(t));
  out.unshift({name:'Fichas (uma por folha: '+use.length+')',rows:[[ (fname||'')+' — fichas por folha' ],head,...rows],kv:1});
  return out; }

  return T; }

    if(l&&!r){ if(b){ if(J(l)!==J(b)) out.push(l); } else out.push(l); return; }
    if(!l&&r){ if(b){ if(J(r)!==J(b)) out.push(r); } else out.push(r); return; }
    if(J(l)===J(r)||J(r)===J(b)) out.push(l); else if(J(l)===J(b)) out.push(r); else out.push(String(r._m||r._c||'')>String(l._m||l._c||'')?r:l); });

    if(J(l)===J(r)||J(r)===J(b)){ if(l!==undefined) o[k]=l; } else if(J(l)===J(b)){ if(r!==undefined) o[k]=r; } else o[k]=l!==undefined?l:r; }); return o; }

alter table public.haccp_membros enable row level security;

  using (lower(email) = lower(auth.jwt()->>'email'));

function parseSteps(text){ const L=String(text||'').split(/\n+/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean); const out=[];
  L.forEach(l=>{ const m=l.match(/^(?:etapa|fase|passo)?\s*(\d{1,2})\s*[.)\-–:]\s*(.{3,70})$/i); if(m&&!/^\d/.test(m[2])) out.push({n:+m[1],nome:m[2].replace(/[.;:]$/,'')}); });
  if(out.length>=3){ const seen=new Set(); return out.sort((a,b)=>a.n-b.n).filter(x=>{ const k=norm(x.nome); if(seen.has(k)) return false; seen.add(k); return true; }).map(x=>x.nome).slice(0,40); }
  const arrows=L.filter(l=>/[↓→⇒>]/.test(l)).flatMap(l=>l.split(/[↓→⇒]|->|=>/)).map(x=>x.trim()).filter(x=>x.length>=3&&x.length<=60);
  return arrows.length>=3?arrows.slice(0,40):[]; }
const colIdx=(head,re)=>head.findIndex(h=>re.test(h));
function parsePccTable(rows){ const hi=headerRow(rows); const H=(rows[hi]||[]).map(norm); if(!H.some(h=>/pcc|ponto critico/.test(h))&&!H.some(h=>/limite critico|limites criticos/.test(h))) return null; if(!H.some(h=>/limite/.test(h))) return null;
  const ix={etapa:colIdx(H,/etapa|fase|operacao|passo/),pcc:colIdx(H,/^pcc|n pcc|ponto critico|codigo/),perigo:colIdx(H,/perigo/),medida:colIdx(H,/medida/),limite:colIdx(H,/limite/),monit:colIdx(H,/monitoriz|vigilancia|como|metodo/),freq:colIdx(H,/frequencia|quando/),resp:colIdx(H,/respons|quem/),acao:colIdx(H,/acao|acoes|correti|correcao/),verif:colIdx(H,/verifica/),registo:colIdx(H,/registo/),valid:colIdx(H,/valida/)};
  const g=(r,k)=>ix[k]>=0?String(r[ix[k]]||'').trim():''; let last=''; const out=[];
  rows.slice(hi+1).forEach(r=>{ if(!r.some(c=>String(c).trim())) return; let et=g(r,'etapa')||last; last=et; const lim=g(r,'limite'); if(!lim&&!g(r,'perigo')) return; out.push({etapa:et||g(r,'pcc')||'Etapa',code:g(r,'pcc'),perigo:g(r,'perigo')||'Perigo identificado no plano',medida:g(r,'medida'),limite:lim,monit:g(r,'monit'),freq:g(r,'freq'),resp:g(r,'resp'),acao:g(r,'acao'),verif:g(r,'verif'),registo:g(r,'registo'),validacao:g(r,'valid')}); });
  return out.length?out:null; }
function parseHazTable(rows){ const hi=headerRow(rows); const H=(rows[hi]||[]).map(norm); if(!H.some(h=>/perigo/.test(h))||!H.some(h=>/probab|gravid|severid|risco|medida|signific/.test(h))) return null;
  const ix={etapa:colIdx(H,/etapa|fase|operacao/),perigo:colIdx(H,/perigo/),cat:colIdx(H,/tipo|categoria|natureza/),causa:colIdx(H,/causa|origem|justifica/),P:colIdx(H,/probab/),G:colIdx(H,/gravid|severid/),medida:colIdx(H,/medida/)};
  const g=(r,k)=>ix[k]>=0?String(r[ix[k]]||'').trim():''; let last=''; const out=[];
  rows.slice(hi+1).forEach(r=>{ const et=g(r,'etapa')||last; last=et; const pg=g(r,'perigo'); if(!pg) return; const c=norm(g(r,'cat')+' '+pg); const cat=/quim/.test(c)?'Q':/fisic/.test(c)?'F':/alerg/.test(c)?'A':'B';
    const n=v=>{ const x=parseInt(String(v).replace(/[^\d]/g,'')); return x>=1&&x<=5?Math.min(3,x>3?3:x):''; };
    out.push({etapa:et,perigo:pg,cat,causa:g(r,'causa'),P:n(g(r,'P')),G:n(g(r,'G')),medida:g(r,'medida')}); });
  return out.length?out:null; }
function findEtapa(nome,proc){ const n=norm(nome); if(!n) return null; const pool=D('etapas').filter(e=>!proc||e.processo===proc); return pool.find(e=>norm(e.nome)===n)||pool.find(e=>norm(e.nome).length>3&&(norm(e.nome).includes(n)||n.includes(norm(e.nome)))); }

const DOC_TIPOS=['Plano HACCP / plano','Procedimento','Instrução de trabalho','Impresso / registo','Ficha técnica','Ficha de segurança','Legislação','Certificado','Outro'];
function guessTipo(n){ n=norm(n);
  if(/haccp|plano de|fluxograma|analise de perigos|\bpcc\b|perigos|plano\b/.test(n)) return 'Plano HACCP / plano';
  if(/\b(reg|regulamento|decreto|dl|lei|portaria|diretiva)\b/.test(n)) return 'Legislação';
  if(/\bfds\b|ficha de seguranca|ficha dados seguranca/.test(n)) return 'Ficha de segurança';
  if(/ficha tecnica|\bft\b|especificac/.test(n)) return 'Ficha técnica';
  if(/procedimento|\bpr\b|\bpg\b/.test(n)) return 'Procedimento';
  if(/instrucao|\bit\b/.test(n)) return 'Instrução de trabalho';
  if(/registo|impresso|\bmod\b|folha|checklist/.test(n)) return 'Impresso / registo';
  if(/certificad|declaracao/.test(n)) return 'Certificado';
  return 'Outro'; }
async function extractText(file){ const n=file.name.toLowerCase();
  if(n.endsWith('.pdf')) return pdfText(file,()=>{},true);
  if(n.endsWith('.docx')){ await loadScript(LIB.docx); return (await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value; }
  if(/\.(xlsx|xls|ods)$/.test(n)){ const wb=await readWB(file); return wb.SheetNames.map(s=>s+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[s])).join('\n'); }
  if(/\.(csv|txt|md)$/.test(n)) return file.text();
  return ''; }

/* ---------- CSV export ---------- */
function exportCSV(key){
  const m=M[key]; const cols=m.f.filter(f=>f.t!=='files'&&f.t!=='sig').map(f=>f.k); if(m.compute&&!cols.includes('conforme')) cols.push('conforme');
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"'; const un=s=>s.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  const xk=[...new Set(D(key).flatMap(r=>Object.keys(r.extra||{})))];
  const lines=[cols.map(c=>q(colLabel(key,c))).concat(xk.map(q)).join(';')];
  sorted(key).forEach(r=>lines.push(cols.map(c=>{ const f=m.f.find(x=>x.k===c); if(f&&f.t==='dyn') return q(un(fmt(key,'resumo',r,true)).replace(/ \(\+\d+\)$/,'')); if(f&&f.t==='lines') return q((r[c]||[]).map(l=>f.cols.map(cc=>cc.t==='ref'?lbl(cc.ref,l[cc.k]):l[cc.k]).filter(Boolean).join(' / ')).join(' | ')); return q(un(fmt(key,c,r,true))); }).concat(xk.map(x=>q((r.extra||{})[x]))).join(';')));
  download('﻿'+lines.join('\r\n'),key+'_'+today()+'.csv','text/csv');
}
function download(content,name,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(content instanceof Blob?content:new Blob([content],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }

   ===================================================================== */
function haCtx(){
  const mats=D('materias'), prods=D('produtos');
  return {sect:S.empresa.sectores||[],
    hasAllergens:mats.some(m=>(m.alergenos||[]).length)||prods.some(p=>(p.alergenos||[]).length),
    hasAdditives:mats.some(m=>m.tipo==='Aditivo'),
    et:D('etapas').slice().sort((a,b)=>String(a.processo||'').localeCompare(String(b.processo||''))||(+a.ordem||0)-(+b.ordem||0))};
}
function decide(r){
  if(r.na) return {cls:'N/A',why:'Marcado como não aplicável'};
  if(!r.sig) return {cls:'PPR',why:'Perigo não significativo — controlado pelos pré-requisitos'};
  if(r.q1==='N') return {cls:'Rever',why:'Q1: sem medidas preventivas — modificar a etapa, o processo ou o produto'};
  if(r.q2==='S') return {cls:'PCC',why:'Q2: a etapa foi concebida para eliminar/reduzir o perigo'};
  if(r.q3==='N') return {cls:'PPRO',why:'Q3: a contaminação não atinge níveis inaceitáveis nesta etapa'};
  if(r.q4==='S') return {cls:'PPRO',why:'Q4: uma etapa posterior elimina/reduz o perigo'};
  return {cls:'PCC',why:'Q4: nenhuma etapa posterior elimina o perigo'};
}
function computeHA(){
  const c=haCtx(); const lim=+S.empresa.limiar||6; const rows=[],pccs=[]; let n=0;
  c.et.forEach(e=>{
    const later=c.et.filter(x=>(x.processo||'')===(e.processo||'')&&(+x.ordem||0)>(+e.ordem||0));
    const L={kill:later.some(x=>['termico','pasteurizacao','reaquecimento'].includes(x.tipo)),metal:later.some(x=>x.tipo==='detecao'),cong:later.some(x=>x.tipo==='armaz_cong')};
    const own=c.sect.filter(k=>SECT[k]&&norm(SECT[k].n)===norm(e.processo)); const ce={...c,sect:own.length?own:c.sect};
    const base=(KB[e.tipo]||[]).filter(h=>!h.when||h.when(ce)).map(h=>({...h,src:'kb',key:e.id+'|'+h.k}));
    const extra=S.ha.extra.filter(x=>x.etapa===e.id).map(x=>({cat:x.cat||'B',perigo:x.perigo||'Novo perigo',causa:'',medida:'',P:1,G:1,q1:'S',q2:'N',q3:'S',q4:'N',src:'extra',xid:x.id,key:e.id+'|x_'+x.id}));
    [...base,...extra].forEach(h=>{
      const o=S.ha.ov[h.key]||{}; const r={...h};
      ['cat','perigo','causa','medida','P','G','q1','q2','q3','q4'].forEach(k=>{ if(o[k]!==undefined&&o[k]!=='') r[k]=o[k]; });
      r.na=!!o.na;
      r.q4auto=['kill','metal','cong'].includes(h.q4)&&(o.q4===undefined||o.q4==='');
      if(r.q4auto) r.q4=L[h.q4]?'S':'N';
      r.P=+r.P||1; r.G=+r.G||1; r.R=r.P*r.G; r.sig=r.R>=lim; r.etapa=e;
      const d=decide(r); r.cls=d.cls; r.why=d.why; r.pd={...(h.pcc||{}),...(o.pcc||{})};
      if(r.cls==='PCC'){ n++; r.code='PCC'+n; pccs.push(r); }
      rows.push(r);
    });
  });
  return {rows,pccs,ctx:c,lim};
}
function haGaps(){
  const g=[]; const w=(t,k)=>g.push({t,k});
  implChecks().filter(x=>!x.ok).forEach(x=>w('Em falta: '+x.t,x.k));
  D('receitas').forEach(rc=>{ const p=D('produtos').find(x=>x.id===rc.produto); if(!p) return; const miss=recipeAllergens(rc).filter(a=>!(p.alergenos||[]).includes(a)); if(miss.length) w('O produto «'+p.nome+'» não declara alergénios presentes na receita: '+miss.join(', '),'produtos'); });
  if(D('etapas').some(e=>['armaz_refrig','armaz_cong'].includes(e.tipo))&&!D('equipamentos').some(isFrio)) w('Há etapas de frio mas nenhum equipamento com limites de temperatura.','equipamentos');
  return g;
}

function traceData(q){ q=String(q||'').trim().toLowerCase(); if(!q) return null;
  const lots=stockLots(); const lotById=Object.fromEntries(lots.map(l=>[l.id,l]));
  const recL=[]; D('rececao').forEach(r=>(r.linhas||[]).forEach(l=>{ if(String(l.lote||'').toLowerCase().includes(q)||String(l.loteInt||'').toLowerCase().includes(q)) recL.push({r,l}); }));
  const prods=D('lotes').filter(p=>String(p.lote||'').toLowerCase().includes(q));
  const ids=new Set(recL.map(x=>x.l.id)); prods.forEach(p=>(p.subprod||[]).forEach(sp=>ids.add('sp:'+p.id+':'+sp.id)));
  const usedBy=D('lotes').filter(p=>(p.consumos||[]).some(c=>ids.has(c.linha)||String(c.lote||'').toLowerCase()===q));

/* ---------- PCC: plano de monitorização ---------- */
function pccFreq(t){ const n=norm(t||''); if(!n) return 'Diária'; const m=n.match(/(\d)\s*(x|vezes)\s*(por|ao|\/)\s*dia/); if(m) return Math.min(4,Math.max(1,+m[1]))+'x por dia';
  if(/cada|lote|entrega|rece|produc|fabrico|ciclo|carga|fornada/.test(n)) return 'Cada lote'; if(/semana/.test(n)) return 'Semanal'; if(/mensal|mes/.test(n)) return 'Mensal'; return 'Diária'; }
function pccPlanList(){ let ha; try{ ha=computeHA(); }catch(e){ return []; }
  return ha.pccs.filter(p=>!p.na).map(p=>{ const regs=D('pccRegisto').filter(r=>r.pcc===p.key).map(r=>r.dt).filter(Boolean).sort(); const last=regs[regs.length-1]; const f=pccFreq(p.pd.freq); let st='';
    if(f==='Cada lote'){ const hp=D('lotes').some(l=>l.data===today()); st=last&&String(last).startsWith(today())?'ok':hp?'bad':''; }
    else { const s=freqStatus(f,regs,''); st=s?(s.done?'ok':s.late?'bad':''):''; }
    return {key:p.key,code:p.code,etapa:(p.etapa||{}).nome||'',perigo:p.perigo,freq:p.pd.freq||f,last,st,pd:p.pd}; }); }
function pccInfoHTML(key){ const x=pccPlanList().find(p=>p.key===key); if(!x) return 'Escolha o PCC — aparece aqui o limite crítico e a ação corretiva.';
  return '<b>'+esc(x.code)+' — '+esc(x.etapa)+'</b><br>Limite crítico: <b>'+esc(x.pd.limite||'—')+'</b>'+(x.pd.monit?'<br>Monitorização: '+esc(x.pd.monit):'')+(x.pd.acao?'<br>Se fora do limite: '+esc(x.pd.acao):''); }

  try{ pendentes().forEach(x=>put(x.k,x.lvl==='danger'?'bad':'warn')); }catch(e){}

/* ---------- Dados / backup ---------- */
async function importBackup(f){
  try{ const x=JSON.parse(await f.text()); if(!x.data) throw 0; if(Object.values(S.data).some(a=>a.length)&&!confirm('Substituir os dados atuais pelos do ficheiro?')) return;
    if(x._files){ for(const [k,v] of Object.entries(x._files)){ if(v.text!=null){ await FDB.put(k,v.text); continue; } const blob=await (await fetch(v.data)).blob(); await FDB.put(k,new File([blob],v.name||k,{type:v.type||blob.type})); } delete x._files; }
    S=migrate(x); save(); if(CUR&&!S.users.find(u=>u.id===CUR.id)) CUR=null; if(CUR) CUR=S.users.find(u=>u.id===CUR.id); toast('Dados importados'+(S.users.length&&!CUR?' — inicie sessão':'')); render(); }
  catch(err){ toast('Ficheiro inválido'); } }

function bindDados(){
  FDB.keys().then(k=>{ const el=document.getElementById('dState'); if(el) el.textContent+=' · '+k.length+' anexo(s)'; }).catch(()=>{});
  document.getElementById('bExp').onclick=async()=>{ const out=JSON.parse(JSON.stringify(S));
    if(document.getElementById('bAtt').checked){ out._files={}; try{ for(const k of await FDB.keys()){ const b=await FDB.get(k); if(typeof b==='string') out._files[k]={text:b}; else if(b) out._files[k]={type:b.type,name:b.name||'',data:await b64(b)}; } }catch(e){} }
    download(JSON.stringify(out),'haccp_backup_'+today()+'.json','application/json'); };
  document.getElementById('bImp').onchange=e=>{ const f=e.target.files[0]; if(f) importBackup(f); };
  document.getElementById('bDemo').onclick=()=>{ if(confirm('Substituir os dados atuais pelo exemplo?')) loadDemo(); };
  document.getElementById('bClr').onclick=async()=>{ if(confirm('Apagar TODOS os dados e anexos? Recomenda-se exportar antes.')){ try{ for(const k of await FDB.keys()) await FDB.del(k); }catch(e){} S=blank(); save(); location.hash='#/painel'; render(); toast('Dados apagados'); } };
}

async function hashPw(pw,salt){ const data=new TextEncoder().encode(salt+'|'+pw);
  if(window.crypto&&crypto.subtle){ const h=await crypto.subtle.digest('SHA-256',data); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  let h=0x811c9dc5; for(const b of data){ h^=b; h=Math.imul(h,16777619)>>>0; } return 'f'+h.toString(16); }

const allTo=n=>()=>Object.fromEntries(navItems().map(x=>[x.k,n]));
const PRESETS={
 'Operador de produção':()=>({planeamento:1,residuos:2,guiasSP:2,expedicoes:2,clientes:1,registos:2,modelos:1,visitantes:2,temperaturas:2,higRegisto:2,controlos:2,pccRegisto:2,lotes:2,rececao:2,receitas:1,stock:1,ajustes:2,nc:2,produtos:1,materias:1,documentos:1}),
 'Receção / armazém':()=>({rececao:2,stock:1,ajustes:2,materias:1,fornecedores:1,temperaturas:2,nc:2,rastreio:1,documentos:1}),
 'Qualidade / HACCP':()=>({...allTo(3)(),dados:0,utilizadores:0}),
 'RH / segurança no trabalho':()=>({colaboradores:3,formacao:3,epiEntregas:3,epis:3,documentos:1,importar:2}),
 'Só consulta':allTo(1),
 'Sem acesso':()=>({})
};
function renderUserChip(){ const el=document.getElementById('tUser'); if(!el) return;
  el.innerHTML=CUR?'<span>'+esc(CUR.nome)+'<br><small style="opacity:.8">'+esc(CUR.perfil==='Administrador'?'Administrador':'Utilizador')+'</small></span><button id="bOut">Sair</button>':''; const b=document.getElementById('bOut'); if(b) b.onclick=logout; }
function startSession(u,keep){ CUR=u; u.last=nowLocal(); save(); try{ sessionStorage.setItem(SESS,u.id); if(keep) localStorage.setItem(SESS,u.id); else localStorage.removeItem(SESS); }catch(e){} lastAct=Date.now(); if(!location.hash||location.hash==='#/') location.hash='#/'+homeRoute(); render(); }
function logout(){ CUR=null; try{ sessionStorage.removeItem(SESS); localStorage.removeItem(SESS); }catch(e){} closeModal(2); closeModal(1); showLogin(); }
function lockedView(html){ document.body.classList.add('locked'); document.getElementById('nav').innerHTML=''; renderUserChip(); document.getElementById('tName').textContent=S.empresa.nome||'Gestão HACCP'; document.getElementById('tSub').textContent='Sistema de Segurança Alimentar'; document.getElementById('view').innerHTML=html; }
function showLogin(){
  const us=S.users.filter(u=>u.ativo!=='Não').sort((a,b)=>a.nome.localeCompare(b.nome));
  lockedView('<div class="card" style="margin-top:30px"><h1>Iniciar sessão</h1><p class="sub">'+esc(S.empresa.nome||'')+'</p>'+
    '<label class="f"><span>Utilizador</span><select id="lgU">'+us.map(u=>'<option value="'+u.id+'">'+esc(u.nome)+' ('+esc(u.login)+')</option>').join('')+'</select></label>'+
    '<label class="f"><span>Palavra-passe</span><input type="password" id="lgP" autocomplete="current-password"></label>'+
    '<label class="sm" style="display:flex;gap:6px;align-items:center;margin-bottom:14px"><input type="checkbox" id="lgK" style="width:auto"> Manter sessão iniciada neste dispositivo</label>'+
    '<button class="btn p" id="lgGo" style="width:100%;justify-content:center">Entrar</button></div><p class="sm mut" style="text-align:center">Esqueceu-se da palavra-passe? Peça ao administrador para a redefinir.</p>');
  const go=async()=>{ const u=S.users.find(x=>x.id===document.getElementById('lgU').value); const pw=document.getElementById('lgP').value;
    if(u&&u.hash===await hashPw(pw,u.salt)) startSession(u,document.getElementById('lgK').checked); else { toast('Palavra-passe incorreta'); document.getElementById('lgP').select(); } };
  document.getElementById('lgGo').onclick=go; document.getElementById('lgP').onkeydown=e=>{ if(e.key==='Enter') go(); }; setTimeout(()=>document.getElementById('lgP')?.focus(),50);
}
function showSetup(){
  lockedView('<div class="card" style="margin-top:20px"><h1>Primeira utilização</h1><p class="sub">Crie o administrador. Depois pode criar os restantes utilizadores e decidir que menus cada um vê.</p>'+
    '<label class="f"><span>Nome</span><input id="suN" placeholder="Ex.: José Loureiro"></label><label class="f"><span>Utilizador (para entrar)</span><input id="suL" autocapitalize="off" placeholder="Ex.: jose"></label>'+
    '<label class="f"><span>Palavra-passe</span><input type="password" id="suP" autocomplete="new-password"></label><label class="f"><span>Repetir palavra-passe</span><input type="password" id="suP2" autocomplete="new-password"></label>'+
    '<button class="btn p" id="suGo" style="width:100%;justify-content:center">Criar administrador e entrar</button></div>'+
    '<div class="card"><b>Outras opções</b><p class="sm mut">Ver um exemplo completo (entra como administrador: utilizador <b>admin</b>, palavra-passe <b>admin</b>) ou recuperar uma cópia de segurança de outro dispositivo.</p><div class="row"><button class="btn" id="suDemo">Carregar exemplo</button><label class="btn">Importar cópia de segurança<input type="file" id="suImp" accept=".json" style="display:none"></label></div></div>');
  document.getElementById('suGo').onclick=async()=>{ const n=document.getElementById('suN').value.trim(), l=document.getElementById('suL').value.trim().toLowerCase(), p=document.getElementById('suP').value, p2=document.getElementById('suP2').value;
    if(!n||!l||!p){ toast('Preencha nome, utilizador e palavra-passe'); return; } if(p.length<4){ toast('A palavra-passe deve ter pelo menos 4 caracteres'); return; } if(p!==p2){ toast('As palavras-passe não coincidem'); return; }
    const u=await mkUser(n,l,p,'Administrador',{}); S.users=[u]; save(); startSession(u,false); toast('Administrador criado'); };
  document.getElementById('suDemo').onclick=()=>loadDemo();
  document.getElementById('suImp').onchange=e=>{ const f=e.target.files[0]; if(f) importBackup(f); };
}
function viewUtilizadores(){
  const us=S.users.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  return '<h1>Utilizadores e permissões</h1><p class="sub">Cada utilizador só vê os menus que lhe forem atribuídos. Níveis: <b>Consultar</b> (só ver), <b>Registar</b> (criar registos e alterar os seus), <b>Total</b> (editar e eliminar tudo).</p>'+
   '<div class="row noprint" style="margin-bottom:12px"><button class="btn p" id="uNew">+ Novo utilizador</button></div><div class="alert info"><i>i</i><span>Para escolher os menus de um utilizador, toque no nome dele (ou em «Escolher menus»). O perfil tem de ser «Utilizador» — o Administrador vê sempre tudo.</span></div>'+
   '<div class="tw"><table><thead><tr><th>Nome</th><th>Utilizador</th><th>Perfil</th><th>Menus</th><th>Último acesso</th><th>Ativo</th></tr></thead><tbody>'+
   us.map(u=>'<tr data-u="'+u.id+'" style="cursor:pointer"><td><b>'+esc(u.nome)+'</b></td><td>'+esc(u.login)+'</td><td>'+(u.perfil==='Administrador'?'<span class="bd info">Administrador</span>':'Utilizador')+'</td><td>'+(u.perfil==='Administrador'?'todos':Object.values(u.perms||{}).filter(v=>+v>0).length)+' <button class="btn s">Escolher menus ›</button></td><td>'+fDate(u.last||'')+'</td><td>'+badge(u.ativo||'Sim')+'</td></tr>').join('')+'</tbody></table></div>'+
   '<div class="card sm mut" style="margin-top:14px">Os utilizadores e as permissões ficam guardados com os dados deste dispositivo. Para usar noutro tablet ou computador, exporte a cópia de segurança e importe-a lá.</div>';
}
function bindUtilizadores(){ document.getElementById('uNew').onclick=()=>userForm(); document.querySelectorAll('tr[data-u]').forEach(tr=>tr.onclick=()=>userForm(tr.dataset.u)); }
function userForm(id){
  const u=id?S.users.find(x=>x.id===id):null; const perms={...(u?u.perms:{})}; const items=navItems(); const groups=[...new Set(items.map(x=>x.g))];
  const body='<div class="grid"><label class="f"><span>Nome <span class="req">*</span></span><input id="ufN" value="'+esc(u?u.nome:'')+'"></label><label class="f"><span>Utilizador (login) <span class="req">*</span></span><input id="ufL" autocapitalize="off" value="'+esc(u?u.login:'')+'"></label>'+
    '<label class="f"><span>Perfil</span><select id="ufR"><option'+(u&&u.perfil==='Administrador'?' selected':'')+'>Administrador</option><option'+(!u||u.perfil!=='Administrador'?' selected':'')+'>Utilizador</option></select></label>'+
    '<label class="f"><span>Ativo</span><select id="ufA"><option>Sim</option><option'+(u&&u.ativo==='Não'?' selected':'')+'>Não</option></select></label>'+
    '<label class="f"><span>'+(u?'Nova palavra-passe (vazio = manter)':'Palavra-passe <span class="req">*</span>')+'</span><input type="password" id="ufP" autocomplete="new-password"></label><label class="f"><span>Repetir palavra-passe</span><input type="password" id="ufP2" autocomplete="new-password"></label></div>'+
    '<div id="ufPerm"><h3>Menus que este utilizador vê</h3><div class="row" style="margin-bottom:10px"><span class="sm mut">Perfis rápidos:</span>'+Object.keys(PRESETS).map(p=>'<button type="button" class="btn s" data-pre="'+esc(p)+'">'+esc(p)+'</button>').join('')+'</div>'+
    groups.map(g=>'<p class="fl" style="margin-top:12px">'+esc(g)+'</p>'+items.filter(x=>x.g===g).map(x=>'<div class="perm"><span>'+esc(x.l)+'</span><select data-perm="'+x.k+'">'+LVL.map((l,i)=>'<option value="'+i+'"'+((+perms[x.k]||0)===i?' selected':'')+'>'+l+'</option>').join('')+'</select></div>').join('')).join('')+'</div>'+
    '<p class="sm mut" id="ufAdm">O administrador vê todos os menus e gere os utilizadores.</p>';
  const admins=()=>S.users.filter(x=>x.perfil==='Administrador'&&x.ativo!=='Não');
  const btns=[];
  if(u&&u.id!==(CUR&&CUR.id)) btns.push({l:'Eliminar',c:'d',fn:()=>{ if(u.perfil==='Administrador'&&admins().length<=1){ toast('Não pode eliminar o único administrador'); return; } if(!confirm('Eliminar o utilizador «'+u.nome+'»? Os registos que criou mantêm-se.')) return; S.users=S.users.filter(x=>x.id!==u.id); save(); closeModal(1); render(); }});
  btns.push({l:'Cancelar',fn:()=>closeModal(1)});
  btns.push({l:'Guardar',c:'p',fn:async r=>{
    const nome=r.querySelector('#ufN').value.trim(), login=r.querySelector('#ufL').value.trim().toLowerCase(), perfil=r.querySelector('#ufR').value, ativo=r.querySelector('#ufA').value, p=r.querySelector('#ufP').value, p2=r.querySelector('#ufP2').value;
    if(!nome||!login){ toast('Indique nome e utilizador'); return; }
    if(S.users.some(x=>x.login===login&&x.id!==(u&&u.id))){ toast('Já existe um utilizador com esse login'); return; }
    if(!u&&!p){ toast('Defina a palavra-passe'); return; } if(p&&p.length<4){ toast('A palavra-passe deve ter pelo menos 4 caracteres'); return; } if(p!==p2){ toast('As palavras-passe não coincidem'); return; }
    if(u&&u.perfil==='Administrador'&&(perfil!=='Administrador'||ativo==='Não')&&admins().length<=1){ toast('Tem de existir pelo menos um administrador ativo'); return; }
    const pm={}; r.querySelectorAll('[data-perm]').forEach(s=>{ if(+s.value>0) pm[s.dataset.perm]=+s.value; });
    const t=u||{id:uid(),salt:uid()}; Object.assign(t,{nome,login,perfil,ativo,perms:pm}); if(p){ t.salt=uid(); t.hash=await hashPw(p,t.salt); }
    if(!u) S.users.push(t); if(CUR&&CUR.id===t.id) CUR=t; save(); closeModal(1); render(); toast('Utilizador guardado'); }});
  const root=modal(u?'Editar utilizador':'Novo utilizador',body,btns,1);
  const sync=()=>{ const adm=root.querySelector('#ufR').value==='Administrador'; root.querySelector('#ufPerm').style.display=adm?'none':''; root.querySelector('#ufAdm').style.display=adm?'':'none'; };
  root.querySelector('#ufR').onchange=sync; sync();
  root.querySelectorAll('[data-pre]').forEach(b=>b.onclick=()=>{ const pm=PRESETS[b.dataset.pre](); root.querySelectorAll('[data-perm]').forEach(s=>s.value=String(+pm[s.dataset.perm]||0)); });
}
['click','keydown','touchstart','pointerdown'].forEach(ev=>document.addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true}));
setInterval(()=>{ const t=+S.empresa.timeout||0; if(CUR&&t>0&&Date.now()-lastAct>t*60000){ logout(); toast('Sessão terminada por inatividade'); } },20000);

function boot(){ let id=null; try{ id=sessionStorage.getItem(SESS)||localStorage.getItem(SESS); }catch(e){} CUR=S.users.find(u=>u.id===id&&u.ativo!=='Não')||null; render(); }
/* ---------- Instalar a app (PWA) ---------- */
let installEvt=null;
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installHelp(){
  if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(()=>{ installEvt=null; document.getElementById('tInstall').hidden=true; }); return; }
  modal('Instalar a app',(isIOS()?
    '<ol style="line-height:1.9;padding-left:20px;margin:0"><li>Abra esta página no <b>Safari</b>.</li><li>Toque no botão <b>Partilhar</b> (quadrado com seta para cima).</li><li>Escolha <b>Adicionar ao ecrã principal</b> e confirme.</li></ol>':
    '<ol style="line-height:1.9;padding-left:20px;margin:0"><li>Abra esta página no <b>Chrome</b>.</li><li>Toque no menu <b>⋮</b> (canto superior direito).</li><li>Escolha <b>Instalar app</b> (ou «Adicionar ao ecrã principal» → <b>Instalar</b>).</li></ol>')+
    '<p class="sm mut" style="margin-top:12px">A app fica com ícone próprio, abre em ecrã inteiro e funciona sem internet com os dados deste dispositivo.</p>',[{l:'Fechar',c:'p',fn:()=>closeModal(1)}],1);
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; const b=document.getElementById('tInstall'); if(b) b.hidden=false; });
window.addEventListener('appinstalled',()=>{ installEvt=null; const b=document.getElementById('tInstall'); if(b) b.hidden=true; toast('App instalada'); });
document.getElementById('tInstall').onclick=installHelp;
if(!isStandalone()) document.getElementById('tInstall').hidden=false;
if('serviceWorker' in navigator&&location.protocol!=='file:') window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

boot();
</script>
</body>
</html>
